<script>
/* ============================================================================
   NOVA CART — NOVA SURE
   data.js  :  case-pack facts, derived KPIs, and calibrated operating data.

   WHAT IS DISCLOSED vs WHAT IS ASSUMED
     disclosed : every figure in NC.CASE.kpi / .survey / .ops / .partners /
                 .support / .funnel / .economics — copied from the case pack.
     derived   : NC.DERIVED — computed here, never typed (GMV, take rate,
                 marginal revenue and promo spend per incremental order, the
                 three possible bases for the repeat-buyer count).
     calibrated: store-level rates and the 400-order sample are generated so
                 that ORDER-WEIGHTED NETWORK AVERAGES reproduce the disclosed
                 11% cancellations / 13% late / 8% substitutions / 15.3% tickets
                 exactly (verified by tests/run_engine.js section K).
     assumed   : NC.ASSUMPTIONS — soft costs with no disclosed value
                 (₹75 ticket, ₹42 refund/substitution event, ₹34 late-order
                 rider minutes, 72% of tickets failure-driven, 58% of promo
                 spend acquisition-tagged). All surfaced in EVIDENCE.md §11
                 and adjustable in the Decision Room.

   DETERMINISM: one seeded RNG (mulberry32, seed 20260202) generates the store
   sample and every Monte Carlo draw, so every run and every reviewer sees the
   same numbers. Nothing here reads the clock, the network or the environment.
   ========================================================================== */
(function (global) {
  'use strict';
  var NC = global.NC = global.NC || {};

  /* ---------- deterministic RNG so every demo run is identical ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  NC.mulberry32 = mulberry32;          // exposed so the engine can derive a
  NC.rng = mulberry32(20260202);       // per-computation stream (see simulate)

  /* =========================== 1. CASE FACTS ============================== */
  NC.CASE = {
    company: {
      name: 'NOVA CART', stores: 620, cities: 3,
      citiesList: ['Nizamabad', 'Warangal', 'Hyderabad'],
      categories: ['Grocery', 'Pharmacy', 'Bakery', 'Stationery']
    },
    kpi: {
      registered: { label: 'Registered users',     prior: 82000,   now: 120000,   unit: 'int',  direction: 'up'   },
      mau:        { label: 'Monthly active users', prior: 39000,   now: 46000,    unit: 'int',  direction: 'up',  inverse: false },
      orders:     { label: 'Monthly orders',       prior: 31200,   now: 38500,    unit: 'int',  direction: 'up'   },
      aov:        { label: 'Average order value',  prior: 452,     now: 486,      unit: 'inr',  direction: 'up'   },
      repeat:     { label: 'Repeat purchase rate', prior: 0.41,    now: 0.27,     unit: 'pct',  direction: 'up'   },
      delivery:   { label: 'Avg delivery time',    prior: 29,      now: 37,       unit: 'min',  direction: 'down' },
      cancel:     { label: 'Order cancellation',   prior: 0.06,    now: 0.11,     unit: 'pct',  direction: 'down' },
      tickets:    { label: 'Support tickets / mo', prior: 3100,    now: 5900,     unit: 'int',  direction: 'down' },
      promo:      { label: 'Promotional spend',    prior: 950000,  now: 1700000,  unit: 'inr',  direction: 'down' },
      revenue:    { label: 'Revenue / month',      prior: 2180000, now: 2610000,  unit: 'inr',  direction: 'up'   }
    },
    survey: [
      { pct: 38, reason: 'Prices / fees feel higher than expected' },
      { pct: 34, reason: 'Delivery takes too long' },
      { pct: 29, reason: 'Products shown available become unavailable after ordering' },
      { pct: 24, reason: 'Discounts are confusing' },
      { pct: 21, reason: 'Prefer purchasing directly from nearby stores' },
      { pct: 18, reason: 'Difficult to discover relevant local products' },
      { pct: 16, reason: 'Experienced refund problems' },

  };

  NC.businessCase = function (params) {
    var P = Object.assign({}, NC.DEFAULTS, params || {});
    var target = P.targetMix || NC.mixWithTicket({ cancel: 0.06, late15: 0.035, sub: 0.04 });
    /* n=200,000: large enough that "today's mix reproduces the disclosed 31%

    var legacy = NC.simulate({ mix: NC.BASE_MIX, p2: P.secondOrder30d, p3: P.thirdOrderRepeat, loyaltyMonths: P.loyaltyMonths, n: 200000 });
    var sure = NC.simulate({ mix: target, p2: P.secondOrder30d, p3: P.thirdOrderRepeat, loyaltyMonths: P.loyaltyMonths, n: 200000 });
    function money(s) { return s.ordersPerCustomer * P.aov * P.takeRate; }
    var ltvLegacy = money(legacy), ltvSure = money(sure);
    var acq = (NC.CASE.kpi.promo.now * NC.CASE.marketing.buyShare) / NC.kpis.newBuyersPerMonth;
    return {
      legacy: legacy, sure: sure, targetMix: target,
      ltvLegacy: ltvLegacy, ltvSure: ltvSure, ltvLift: (ltvSure - ltvLegacy) / ltvLegacy,
      ordersLegacy: legacy.ordersPerCustomer, ordersSure: sure.ordersPerCustomer,
      cac: acq, ltvCacLegacy: ltvLegacy / acq, ltvCacSure: ltvSure / acq,
      cohortMonthlyGain: (ltvSure - ltvLegacy) * NC.kpis.newBuyersPerMonth,

  };

  /* ======================= 6. NETWORK LEAK MAP =========================== */
  NC.worldRates = function (world) {
    world = world || NC.STORES;
    var ws = 0, c = 0, l = 0, s = 0;
    world.forEach(function (x) { ws += x.orderWeight; c += x.orderWeight * x.cancelRate; l += x.orderWeight * x.lateRate; s += x.orderWeight * x.subRate; });
    var out = { cancel: c / ws, late: l / ws, sub: s / ws };
    out.ticket = NC.worldTicketRate({ cancel: out.cancel, late15: out.late, sub: out.sub });
    return out;
  };

  NC.leakMap = function (world) {
    world = world || NC.STORES;
    var K = NC.CASE.kpi, AOV = K.aov.now, take = NC.kpis.takeNow, orders = K.orders.now;
    var R = NC.worldRates(world);
    var cancels = orders * R.cancel;
    var delivered = orders - cancels;
    var lateOrders = orders * R.late;
    var subOrders = orders * R.sub;

    var lines = [
      { id: 'lostGMV', label: 'Revenue lost on cancelled orders', owner: 'Inventory accuracy',
        value: cancels * AOV * take, detail: F.num(cancels) + ' orders/mo · ' + F.pct(R.cancel) + ' of demand',
        lever: 'Availability score + verified-stock gate', evidence: 'Case §5 order outcomes' },
      { id: 'support', label: 'Support cost caused by fulfilment failures', owner: 'Support',
        value: orders * R.ticket * 0.72 * NC.CASE.support.ticketCost,
        detail: F.num(orders * R.ticket) + ' tickets/mo · 72% are refund, delay or missing-item',
        lever: 'Fewer failures + proactive status push', evidence: 'Case §8 ticket mix' },
      { id: 'refund', label: 'Refunds & goodwill compensations', owner: 'Refunds',
        value: orders * 0.06 * 42, detail: '6% of orders need a refund or a support fix, ~₹42 of compensation each',
        lever: 'Confirm before payment · auto-compensate after', evidence: 'Case §5 · ₹42 per case assumed' },
      { id: 'rider', label: 'Rider minutes burnt on re-tries and waits', owner: 'Delivery',
        value: lateOrders * 34, detail: F.num(lateOrders) + ' orders/mo arrive >15 min late · ~₹34 of idle rider-minutes each',
        lever: 'An honest promise is a schedulable promise', evidence: 'Case §5 · ₹34 per case assumed' },
      { id: 'subCost', label: 'Substitution friction (calls, swaps, comps)', owner: 'Store ops',
        value: subOrders * 42, detail: F.num(subOrders) + ' orders/mo contain a substitute the customer did not approve',
        lever: 'Offer the swap before ordering, not after', evidence: 'Case §5 · ₹42 per case assumed' }
    ];
    var reliabilityLeak = lines.reduce(function (a, l) { return a + l.value; }, 0);
    /* Sensitivity: rebuild the leak with the assumed unit costs halved. Those are
       the only soft inputs in the map — every other input is a disclosed
       order-level rate — so this is the honest "what if our assumptions are
       generous to us" test. */
    function byId(id) { return (lines.filter(function (l) { return l.id === id; })[0] || { value: 0 }).value; }
    var softLines = byId('refund') + byId('rider') + byId('subCost');
    /* Sensitivity: rebuild the leak with the assumed unit costs halved. Those are
       the only soft inputs in the map — every other input is a disclosed
       order-level rate — so this is the honest "what if our assumptions are
       generous to us" test. */
    function byId(id) { return (lines.filter(function (l) { return l.id === id; })[0] || { value: 0 }).value; }
    var softLines = byId('refund') + byId('rider') + byId('subCost');
    /* ONE cohort number in the whole submission: the business case at the full
       fixed failure mix. Realisability is handled separately and explicitly by
       the coverage ramp in the 12-month plans — not by silently haircutting the
       mix here and reporting a second, smaller figure elsewhere. */
    var bc = NC.businessCase();

    return {
      lines: lines,
      reliabilityLeak: reliabilityLeak,
      softAssumedCost: softLines,
      reliabilityLeakSoftHalf: reliabilityLeak - 0.5 * softLines,
      promoWaste: K.promo.now * 0.44,
      cohortLifetimeRevenueGain: bc.cohortMonthlyGain,
      totalMonthlyValue: reliabilityLeak + bc.cohortMonthlyGain,
      annualised: (reliabilityLeak + bc.cohortMonthlyGain) * 12,
      annualisedDirect: reliabilityLeak * 12,
      rates: Object.assign({}, R, { cancels: cancels, lateOrders: lateOrders, subOrders: subOrders, delivered: delivered }),
      businessCase: bc
    };
  };

  /* ============= 7. INTERVENTION QUEUE (generated from the data) ========= */
  NC.interventionQueue = function (world) {
    world = world || NC.STORES;
    var AOV = NC.CASE.kpi.aov.now, take = NC.kpis.takeNow;
    var bc = NC.businessCase();
    var ltvLift = bc.ltvSure - bc.ltvLegacy;              // ₹ of lifetime revenue rescued per failed experience
    var out = [];

    world.forEach(function (s) {
      var cancels = s.monthlyOrders * s.cancelRate;
      var tickets = s.monthlyOrders * NC.worldTicketRate({ cancel: s.cancelRate, late15: s.lateRate, sub: s.subRate });
      var subs = s.monthlyOrders * s.subRate;
      void 0;
      var remC = cancels, remS = subs, remT = tickets;

      var acts = [];
      if (s.syncHours > 6) acts.push({ id: 'sync', label: 'Enable NOVA SURE Sync — store verifies its list in 15 seconds, twice a day', cutCancel: s.syncHours > 36 ? 0.48 : s.syncHours > 24 ? 0.42 : 0.30, cutSub: 0.25, cutTicket: 0.30, effort: 1 });
      if (s.cancelRate > 0.14) acts.push({ id: 'gate', label: 'Availability-gate the riskiest SKUs until the store verifies them', cutCancel: 0.28, cutSub: 0.15, cutTicket: 0.18, effort: 1 });
      if (s.acceptRate < 0.93) acts.push({ id: 'cap', label: 'Send a peak-hour demand forecast + a capacity cap the store can accept', cutCancel: 0.16, cutSub: 0, cutTicket: 0.10, effort: 1 });
      if (s.subRate > 0.09) acts.push({ id: 'subsop', label: "Push a 2-tap substitution SOP with this store's 5 most likely swaps", cutCancel: 0, cutSub: 0.45, cutTicket: 0.12, effort: 1 });
      if (s.reliability < 55) acts.push({ id: 'call', label: 'Partner-success call — churn-risk store (18% of partners are considering leaving)', cutCancel: 0.09, cutSub: 0.05, cutTicket: 0.08, effort: 2 });
      if (s.syncHours <= 6 && s.cancelRate > 0.075) acts.push({ id: 'nudge', label: 'Turn on the pre-peak stock nudge — 3 SKUs likely to run out this evening', cutCancel: 0.14, cutSub: 0.10, cutTicket: 0.10, effort: 1 });

      acts.forEach(function (a) {
        /* incremental, so actions on the same store never double-count */
        var dC = remC * a.cutCancel, dS = remS * a.cutSub, dT = remT * a.cutTicket;
        var vCancel = dC * AOV * take;
        var vSub = dS * 42;
        var vTicket = dT * NC.CASE.support.ticketCost;
        var vRepeat = dC * ltvLift * 0.55;
        remC -= dC; remS -= dS; remT -= dT;
        out.push(Object.assign({ storeId: s.id, storeName: s.name, city: s.city, category: s.category,
          reliability: s.reliability, syncHours: s.syncHours, monthlyOrders: s.monthlyOrders,
          vCancel: vCancel, vSub: vSub, vTicket: vTicket, vRepeat: vRepeat,
          monthlyValue: vCancel + vSub + vTicket }, a,
          { gain: vCancel + vSub + vTicket + vRepeat }));
        out[out.length - 1].gain = vCancel + vSub + vTicket;
      });
    });
    out.sort(function (a, b) { return (b.gain / b.effort) - (a.gain / a.effort); });
    var cum = 0;
    out.forEach(function (a, i) { a.rank = i + 1; cum += a.gain; a.cumulative = cum; });
    out.totalMonthly = cum;
    out.totalLifetime = out.reduce(function (x, a) { return x + a.vRepeat; }, 0);
    return out;
  };

  NC.applyIntervention = function (storeId, actionId, cues) {
    var s = NC.storeById(storeId);
    if (!s) return null;
    cues = cues || {};
    var before = { syncHours: s.syncHours, cancelRate: s.cancelRate, subRate: s.subRate, acceptRate: s.acceptRate, reliability: s.reliability };
    var m = {
      sync:   { sync: 0, cancel: s.syncHours > 24 ? 0.58 : 0.72, sub: 0.80, rel: 22 },
      gate:   { cancel: 0.78, sub: 0.88, rel: 9 },
      cap:    { cancel: 0.88, acc: 0.07, rel: 6 },
      subsop: { sub: 0.62, rel: 5 },
      call:   { cancel: 0.94, acc: 0.03, rel: 4 },
      nudge:  { cancel: 0.90, sub: 0.92, rel: 6 }
    }[actionId];
    if (!m) return null;
    if (m.cancel) s.cancelRate *= m.cancel;
    if (m.sub) s.subRate *= m.sub;
    if (m.acc) s.acceptRate = Math.min(0.99, s.acceptRate + m.acc);
    if (actionId === 'sync') { s.syncHours = Math.min(s.syncHours, 2); s.syncPerDay = Math.max(s.syncPerDay, 3); }
    s.reliability = NC.clamp(s.reliability + (m.rel || 4), 12, 97);
    s.touched = true;
    return { store: s, before: before };
  };

  NC.autoHeal = function (limit) {
    var q = NC.interventionQueue().filter(function (a) { return !a.applied; });
    var applied = 0, gain = 0, done = {};
    for (var i = 0; i < q.length && applied < (limit || 20); i++) {
      var a = q[i];
      if (done[a.storeId + a.id]) continue;
      NC.applyIntervention(a.storeId, a.id);
      a.applied = true; done[a.storeId + a.id] = 1;
      applied++; gain += a.gain;
      NC.logIntervention(a.storeId, a.id, a.label, a.gain);
    }
    return { applied: applied, gain: gain };
  };

  /* ============= 8. TWELVE-MONTH COHORT MODEL (the coin, not the ad) ===== */
  NC.PLANS = {
    A: { id: 'A', name: 'Plan A — Scale acquisition', tagline: 'What management is considering: +30% marketing, no product change.',
         spendMult: 1.30, acqShare: 0.58, reliabilityShare: 0, program: 0, couponRecovery: 0,
         mix: NC.BASE_MIX, attempt: true },
    B: { id: 'B', name: 'Plan B — NOVA SURE', tagline: '₹25L reliability product, promo held flat, the 44% of coupons that were never redeemed re-pointed at retention.',
         spendMult: 1.00, acqShare: 0.58, reliabilityShare: 1, program: 2500000, couponRecovery: 0.25,
         mix: { cancel: 0.06, late15: 0.035, sub: 0.04, ticket: 0.105 }, attempt: true },
    C: { id: 'C', name: 'Plan C — Do nothing', tagline: 'Hold spend flat and ship nothing. The honest counterfactual.',
         spendMult: 1.00, acqShare: 0.58, reliabilityShare: 0, program: 0, couponRecovery: 0, mix: NC.BASE_MIX }
  };
  NC.programPhase = [0.10, 0.16, 0.20, 0.20, 0.18, 0.16];

  /* The failure cost of the network as it stands today.  Everything in the
     projection is expressed as a DELTA against this month, because we do not
     know NOVA CART's rider base pay, commissions or tech costs — so we never
     claim an absolute profit number, only movement against today.        */
  NC.baselineMonth = (function () {
    var K = NC.CASE.kpi, AOV = K.aov.now, take = NC.kpis.takeNow, orders = K.orders.now;
    var M = NC.BASE_MIX;
    return {
      orders: orders,
      revenue: orders * AOV * take,
      promo: K.promo.now,
      tickets: K.tickets.now,
      support: K.tickets.now * NC.CASE.support.ticketCost,
      refundCancel: orders * M.cancel * AOV * take,
      compensation: orders * 0.06 * 42,
      rider: orders * (1 - M.cancel) * M.late15 * 34,
      sub: orders * (1 - M.cancel) * M.sub * 42
    };
  })();

  /* the repeat-rate reaction function is fitted to NOVA CART's own history:
     41% repeat when cancellations were 6%, 27% when they reached 11%.      */
  NC.repeatFromCancel = function (cancelRate, P) {
    var gap = NC.clamp((NC.BASE_MIX.cancel - cancelRate) / (NC.BASE_MIX.cancel - 0.06), 0, 1.2);
    return P.repeatRateNow + (P.historicRepeat - P.repeatRateNow) * P.reliabilityShare * gap;
  };

  NC.project = function (input) {
    input = input || {};
    var P = Object.assign({}, NC.DEFAULTS, input.params || {});
    var plan = Object.assign({}, NC.PLANS.B, input.plan || {});
    var months = input.months || 12;
    var coverage = input.coverage === undefined ? P.coverage : input.coverage;
    var startPromo = NC.CASE.kpi.promo.now;
    var baseAcq = startPromo * 0.58;
    var isFix = plan.id === 'B';
    var cov = isFix ? coverage : 0;

    /* the product is the only thing that changes the failure mix */
    var mix = {};
    ['cancel', 'late15', 'sub', 'ticket'].forEach(function (k) {
      mix[k] = NC.BASE_MIX[k] + (plan.mix[k] - NC.BASE_MIX[k]) * cov;
    });

    /* the funnel responds to the failure mix, analytically — no sampling noise */
    var mixLift = mixMean(mix) / mixMean(NC.BASE_MIX);
    var p2 = NC.clamp(P.secondOrder30d * mixLift, 0.10, 0.70);
    var churn = (1 - P.monthlyRetention) * (1 - P.retentionResponse * cov);
    var pRetain = 1 - churn;
    var freq = P.freqReturning * (1 + (mixLift - 1) * 0.30);
    var conv = NC.clamp(P.firstOrderConv * (1 + (mixLift - 1) * 0.40), 0.30, 0.85);

    var returning = NC.NOW.orderingCustomers - NC.NOW.newBuyers;
    var registered = NC.CASE.kpi.registered.now;
    var rows = [], cumProgram = 0, cumContribution = 0;
    var programTotal = plan.program * (1 + (input.programOverrun || 0));
    var prevNewBuyers = NC.NOW.newBuyers;

    for (var m = 1; m <= months; m++) {
      var rampIn = m / 3;
      /* the fix rolls out store by store: coverage ramps to plan level by M4 */
      var covM = cov * Math.min(1, m / 4);
      var mixM = {};
      ['cancel', 'late15', 'sub', 'ticket'].forEach(function (k) {
        mixM[k] = NC.BASE_MIX[k] + (plan.mix[k] - NC.BASE_MIX[k]) * covM;
      });
      var mixM = NC.mixWithTicket(mixM);
      var liftM = mixMean(mixM) / mixMean(NC.BASE_MIX);
      var churnM = (1 - P.monthlyRetention) * (1 - P.retentionResponse * covM);
      var p2M = NC.clamp(P.secondOrder30d * liftM, 0.10, 0.70);
      var freqM = P.freqReturning * (1 + (liftM - 1) * 0.30);
      var convM = NC.clamp(P.firstOrderConv * (1 + (liftM - 1) * 0.40), 0.30, 0.85);
      var spendMult = 1 + (plan.spendMult - 1) * Math.min(1, m / 2);
      var promo = plan.attempt === false ? startPromo : startPromo * spendMult;
      if (plan.id === 'C') promo = startPromo;
      var couponSave = plan.couponRecovery ? startPromo * 0.44 * plan.couponRecovery : 0;
      var newReg = NC.CASE.marketing.newRegPerMonth * Math.pow((promo * plan.acqShare) / baseAcq, 0.75);
      var newBuyers = newReg * convM * (plan.id === 'A' ? 1 + 0.04 * Math.min(1, rampIn) : 1);

      var retained = returning * (1 - churnM);
      var inflow = prevNewBuyers * p2M;                                 // last month's buyers returning
      var returningPrev = returning;
      returning = retained + inflow;

      var orders = newBuyers * NC.FREQ.m1 + returning * freqM;
      var gmv = orders * P.aov;
      var take = plan.id === 'A' ? 0.134 : plan.id === 'B' ? 0.141 : P.takeRate;
      var mix = mixM;
      var revenue = gmv * take;

      var B = NC.baselineMonth;
      var tickets = orders * mixM.ticket;
      var supportCost = tickets * NC.CASE.support.ticketCost;
      var refundCancel = orders * mix.cancel * P.aov * take;
      var compensation = orders * 0.06 * (mixM.ticket / NC.BASE_MIX.ticket) * 42;
      var rider = orders * mixM.late15 * 34;
      var subCost = orders * mixM.sub * 42;
      var prog = m <= 6 ? programTotal * NC.programPhase[m - 1] : 0;
      cumProgram += prog;
      /* everything is a delta against the month we are standing in */
      var dRevenue = revenue - B.revenue;
      var dCost = (supportCost - B.support) + (refundCancel + compensation - B.refundCancel - B.compensation)
        + (rider - B.rider) + (subCost - B.sub);
      var contribution = dRevenue - dCost - (promo - B.promo) - prog;
      cumContribution += contribution;

      registered += newReg;
      prevNewBuyers = newBuyers;
      rows.push({
        month: m, promo: promo, newReg: newReg, newBuyers: newBuyers, returning: returning,
        returningPrev: returningPrev, retained: retained, inflow: inflow,
        orderingCustomers: newBuyers + returning,
        orders: orders, gmv: gmv, revenue: revenue, take: take, mixUsed: mixM, covM: covM,
        tickets: tickets, supportCost: supportCost, program: prog, contribution: contribution,
        refundCost: refundCancel + compensation, riderCost: rider, subCost: subCost,
        dRevenue: dRevenue, dCost: dCost, cumContribution: cumContribution, couponSave: couponSave,
        ordersAbs: orders * (1 - mix.cancel), servedShare: 1 - mix.cancel,
        p2: p2M, pRetain: 1 - churnM, churn: churnM, mixLift: liftM,
        /* lifetime repeat metric: NOVA CART's own two-point elasticity */
        repeatRate: NC.repeatFromCancel(mixM.cancel, { repeatRateNow: P.repeatRateNow, historicRepeat: P.historicRepeat, reliabilityShare: P.reliabilityShare }),
        costPerOrder: (promo + supportCost) / orders, promoPerOrder: promo / orders

    var payback = null;
    if (plan.program > 0) for (var i = 0; i < rows.length; i++) if (rows[i].cumContribution >= 0) { payback = rows[i].month; break; }
    return {

    };
  };

        out.push('<path d="' + d + ' L' + x(n - 1).toFixed(1) + ' ' + y(opts.zeroBase ? 0 : min).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(opts.zeroBase ? 0 : min).toFixed(1) + ' Z" fill="' + s.colour + '" opacity=".10"/>');
      }
      out.push('<path d="' + d + '" fill="none" stroke="' + s.colour + '" stroke-width="' + (s.width || 2.4) + '"' + (s.dashed ? ' stroke-dasharray="5 4"' : '') + ' stroke-linejoin="round"/>');
      if (s.dots !== false) s.values.forEach(function (v, i) {
        if (n > 13 && i % 2 && i !== n - 1) return;
        out.push('<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.6" fill="#fff" stroke="' + s.colour + '" stroke-width="1.8"/>');
      });
    });
    out.push('</svg>');
    var legend = '<div class="btnrow" style="margin-top:2px">' + series.map(function (s) {
      return '<span class="mini"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' + s.colour + ';margin-right:5px"></span>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
    return out.join('') + legend;
  }

  function barRows(rows, opts) {

  /* ============================= CUSTOMER APP ============================ */
  function suggestBasket(storeId) {
    var s = NC.storeById(storeId);
    var scored = NC.SKUS.map(function (k) { return { k: k, a: NC.availability(s, k) }; });
    var inCat = scored.filter(function (x) { return x.k.cat === s.category; });
    var others = scored.filter(function (x) { return x.k.cat !== s.category; });
    inCat.sort(function (a, b) { return b.a.score - a.a.score; });
    others.sort(function (a, b) { return a.a.score - b.a.score; });
    var pick = [];
    if (inCat[0]) pick.push(inCat[0].k.id);
    if (inCat[1]) pick.push(inCat[1].k.id);
    others.slice(0, 2).forEach(function (x) { pick.push(x.k.id); });
    return pick.slice(0, 4).map(function (id) { return { skuId: id, qty: 1 }; });
  }

  function ensureSeed() {
    var A = NC.APP;
    if (!A.seedDone) { A.cart = suggestBasket(A.storeId); A.seedDone = true; }
    return A;
  }

  function catalogue(store) {
    var s = NC.SKUS.map(function (k) { return { k: k, a: NC.availability(store, k) }; });
    var inCat = s.filter(function (x) { return x.k.cat === store.category; });
    var rest = s.filter(function (x) { return x.k.cat !== store.category; });
    inCat.sort(function (a, b) { return b.a.score - a.a.score; });
    rest.sort(function (a, b) { return b.a.score - a.a.score; });
    return inCat.concat(rest).slice(0, 12);
  }

  function bandBadge(a) {
    return '<span class="badge" style="background:' + a.band.colour + '1a;color:' + a.band.colour + '"><span class="sd" style="background:' + a.band.colour + '"></span>' +
      a.band.label + (a.qty > 0 ? ' · ' + a.score : '') + '</span>';
  }

        '<p class="sub">' + store.category + ' · ' + esc(store.area) + ', ' + store.city + ' · catalogue updated ' + (store.syncHours <= 2 ? 'live' : store.syncHours + 'h ago') + '</p>' +
        '<div class="btnrow" style="margin-bottom:12px"><button class="btn sm" data-act="step" data-step="1">← change store</button>' +
        '<span class="mini">Every price shown is the store\'s own — NOVA SURE never changes what the shop charges.</span></div>' +
        '<div class="shelf">' + items.map(function (x) {
          var a = x.a, q = inCart[x.k.id] || 0;
          return '<div class="item ' + (q ? 'incart' : '') + '">' +
            '<div class="nm">' + esc(x.k.name) + '</div>' +
            bandBadge(a) +
            '<div class="foot"><span class="pr num">₹' + x.k.price + '</span>' +
            (q ? '<span class="qty"><button data-act="qty" data-sku="' + x.k.id + '" data-d="-1">−</button><span class="num">' + q + '</span><button data-act="qty" data-sku="' + x.k.id + '" data-d="1">+</button></span>'
              : '<button class="btn sm primary" data-act="qty" data-sku="' + x.k.id + '" data-d="1">Add</button>') +
            '</div></div>';
        }).join('') + '</div></div>' +

        '<div class="card"><h2>Basket</h2><p class="sub">' + A.cart.length + ' line' + (A.cart.length === 1 ? '' : 's') + ' · ₹' + F.num(total) + '</p>' +
        (A.cart.length ? A.cart.map(function (l) {
          var k = NC.skuById(l.skuId), a = NC.availability(store, k);
          return '<div class="cartline"><div style="flex:1"><div class="t">' + esc(k.name) + '</div>' +
            '<div class="m">' + l.qty + ' × ₹' + k.price + ' · ' + a.band.label + ' at this store · ' + a.evidence + '</div></div>' +
            '<button class="btn sm" data-act="qty" data-sku="' + k.id + '" data-d="-1">−</button></div>';
        }).join('') : '<p class="mini">Add items from the shelf.</p>') +
        '<div class="rule"></div>' +
        '<button class="btn primary" data-act="step" data-step="3" ' + (A.cart.length ? '' : 'disabled') + '>Review the promise →</button>' +
        '<p class="mini" style="margin-top:9px">Nothing is hidden at this step: the same availability scores the engine uses at order time are on the shelf card.</p>' +
        '</div></div>';
    }

    /* ---------- step 3 : the promise ---------- */
    if (A.step === 3) {
      var plan = NC.routeBasket(A.cart, A.city, { primaryStoreId: store.id });
      var prom = NC.promise(store, A.cart, { extraMin: plan.extraMin });
      A.plan = plan; A.promise = prom;
      var changed = plan.lines.filter(function (l) { return l.action !== 'sell'; });
      var removedRisk = Math.max(0, (plan.riskBefore - plan.riskAfter) / Math.max(plan.riskBefore, 0.01));
      var newCancel = Math.max(0.028, 0.11 * (1 - removedRisk * 0.75));

      var left = '<div>' +
        '<div class="card"><h2>Before checkout, the engine re-plans the basket</h2>' +
        '<p class="sub">It scores every line against the store\'s <b>real</b> history and the age of its catalogue — then fixes whatever cannot honestly be promised.</p>' +
        plan.lines.map(function (l) {
          var chg = l.action !== 'sell';
          return '<div class="planbox ' + (chg ? 'chg' : '') + '"><h4><span>' + esc(l.name) + ' × ' + l.qty + '</span>' +
            '<span class="badge" style="background:' + (chg ? '#fdf1dd' : '#e6f7ee') + ';color:' + (chg ? '#9a6414' : '#0b7a45') + '">' +
            (chg ? l.action.toUpperCase() : 'PROMISABLE') + '</span></h4>' +
            '<p><b>Availability score ' + l.score + ' → ' + l.fixedScore + '</b> · ' + esc(l.actionLabel) + '</p>' +
            '<p class="mini" style="margin-top:4px">' + esc(chg && l.fixedEvidence ? l.fixedEvidence : l.evidence) + '</p>' +
            (l.action === 'substitute' ? '<p class="mini" style="margin-top:4px">Price difference: ' + (l.substitute.priceDelta === 0 ? 'none' : (l.substitute.priceDelta > 0 ? '+' : '') + '₹' + l.substitute.priceDelta) + ' — shown before payment, never after.</p>' : '') +
            (l.action === 'reroute' ? '<p class="mini" style="margin-top:4px">Adds ~' + Math.round(l.etaDelta) + ' min of travel. We would rather arrive a few minutes later than cancel on you.</p>' : '') +
            '</div>';
        }).join('') +
        '<div class="rule"></div>' +
        '<div class="kv"><span>Basket miss risk before re-planning</span><b style="color:var(--dang)">' + F.pct(plan.riskBefore, 1) + '</b></div>' +
        '<div class="kv"><span>Miss risk after re-planning</span><b style="color:var(--ok)">' + F.pct(plan.riskAfter, 1) + '</b></div>' +
        '<div class="kv"><span>Stores involved</span><b>' + plan.stops + ' (' + esc(plan.primaryStore) + ')' + '</b></div>' +
        '<div class="kv"><span>Lines fixed before the customer ever saw them</span><b>' + changed.length + ' of ' + plan.lines.length + '</b></div>' +
        '</div>' +

        '<div class="card" style="margin-top:16px"><h2>From basket to order</h2>' +
        '<p class="sub">The customer experience: one window, and no silent substitution.</p>' +
        '<div class="promise"><div class="cap">Arrives between</div>' +
        '<div class="big num">' + (prom.smart.promise - 4) + '–' + (prom.smart.promise + 5) + '<small> min</small></div>' +
        '<div class="window">🔒 ' + plan.lines.filter(function (l) { return l.fixedScore >= 62; }).length + ' of ' + plan.lines.length + ' lines verified within the last 2 hours · any swap must be approved by you in-app</div>' +
        '<div class="row"><div>Promise kept (±5 min)<b>' + F.pct(prom.smart.kept, 0) + '</b></div>' +
        '<div>Arrives >15 min late<b>' + F.pct(prom.smart.late15, 1) + '</b></div>' +
        '<div>Chance of a cancellation<b>' + F.pct(newCancel, 1) + '</b></div></div></div>' +
        '<div class="rule"></div>' +
        '<h3>The same basket through the old engine</h3>' +
        '<table><thead><tr><th>What the customer experiences</th><th class="r">Old engine</th><th class="r">NOVA SURE</th></tr></thead><tbody>' +
        '<tr><td>Promised time</td><td class="r num">' + prom.legacy.promise + ' min</td><td class="r num"><b>' + (prom.smart.promise - 4) + '–' + (prom.smart.promise + 5) + ' min</b></td></tr>' +
        '<tr><td>Honest central estimate for this basket</td><td class="r num">' + prom.central + ' min</td><td class="r num">' + prom.central + ' min</td></tr>' +
        '<tr><td>Probability of arriving >15 min late</td><td class="r num up-bad">' + F.pct(prom.legacy.late15, 1) + '</td><td class="r num up-good"><b>' + F.pct(prom.smart.late15, 1) + '</b></td></tr>' +
        '<tr><td>Probability of landing within ±5 min</td><td class="r num">' + F.pct(prom.legacy.kept, 0) + '</td><td class="r num up-good"><b>' + F.pct(prom.smart.kept, 0) + '</b></td></tr>' +
        '<tr><td>Chance this basket ends in a cancellation</td><td class="r num up-bad">' + F.pct(Math.min(0.99, plan.riskBefore * 1.05), 0) + '</td><td class="r num up-good"><b>' + F.pct(newCancel, 1) + '</b></td></tr>' +
        '</tbody></table>' +
        '<p class="mini" style="margin-top:10px">The old promise is shorter. That is exactly the problem: it is short because it is optimistic, and we miss it ' + F.pct(prom.legacy.late15, 1) + ' of the time. A promise that is a few minutes longer and an order of magnitude more reliable is a better product.</p>' +
        '<div class="btnrow" style="margin-top:14px"><button class="btn" data-act="step" data-step="2">← edit basket</button>' +
        '<button class="btn primary" data-act="step" data-step="4">Send 1,000 of these orders →</button></div>' +
        '</div></div>';

      var right = '<div>' +
        '<div class="card"><h2>Trust receipt</h2><p class="sub">Every order leaves a record ops can act on and the customer can see.</p>' +
        '<div class="kv"><span>Primary store</span><b>' + esc(plan.primaryStore) + '</b></div>' +
        '<div class="kv"><span>Store catalogue age</span><b>' + (store.syncHours <= 2 ? 'live' : store.syncHours + ' h') + '</b></div>' +
        '<div class="kv"><span>Lines scored Verified</span><b>' + plan.lines.filter(function (l) { return l.fixedScore >= 82; }).length + ' / ' + plan.lines.length + '</b></div>' +
        '<div class="kv"><span>Average availability score</span><b>' + Math.round(plan.avgScoreBefore) + ' → ' + Math.round(plan.avgScoreAfter) + '</b></div>' +
        '<div class="kv"><span>Store cancel rate on record</span><b>' + F.pct(store.cancelRate, 1) + '</b></div>' +
        '<div class="kv"><span>Network promises broken today</span><b class="up-bad">' + F.pct(NC.CASE.kpi.cancel.now, 0) + ' cancelled · ' + F.pct(0.13, 0) + ' late</b></div>' +
        '<div class="rule"></div>' +
        '<h3>Why this store</h3>' +
        '<p class="mini">The app used to sort stores by star rating. It now sorts by <b>availability reliability for this exact basket</b>: catalogue freshness, this store\'s failure history on these specific items, and travel time. That is why ' + esc(store.name) + ' comes first.</p>' +
        '<div class="quote">"Customers blame us when the app says something is available but we don\'t actually have it." — partner store, case §6</div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px"><h2>What the customer is told</h2>' +
        '<p class="mini">A 12-minute window, the store\'s name and distance, the last verification time, and a plain sentence about what happens if reality changes:</p>' +
        '<div class="quote" style="border-color:var(--acc)">"' + esc(store.name) + ' last confirmed your 4 items at 6:42 pm. If anything has run out, we will message you before the rider leaves, and you will approve any swap — or drop the line and pay less."</div>' +
        '<div class="kv"><span>Refund if we break this promise</span><b>automatic, no ticket needed</b></div>' +
        '<div class="kv"><span>Customer effort to get it</span><b>zero</b></div>' +
        '</div></div>';

      var proof = (function () {
        var p2 = A.plan, pr2 = A.promise;
        var rm = Math.max(0, (p2.riskBefore - p2.riskAfter) / Math.max(p2.riskBefore, 0.01));
        var legacyMix = NC.BASE_MIX;
        var sureMix = NC.mixWithTicket({
          cancel: Math.max(0.028, 0.11 * (1 - rm * 0.75)),
          late15: Math.max(0.008, pr2.smart.late15 + 0.012),
          sub: Math.max(0.012, 0.08 * (1 - rm * 0.5))
        });
        var bcL = NC.simulate({ mix: legacyMix, n: 15000 });
        var bcS = NC.simulate({ mix: sureMix, n: 15000 });
        var N = 1000;
        var out = ['<div class="card" style="margin-top:16px;border-left:4px solid var(--acc)"><h2>1,000 customers, same basket, both engines</h2>',
          '<p class="sub">A 15,000-customer Monte Carlo over the disclosed funnel (54% first order, 31% second order in 30 days, 72% monthly repeat at 3+ orders), with conversion perturbed by the failure mix.</p>',
          '<table><thead><tr><th>Per 1,000 customers</th><th class="r">Old engine</th><th class="r">NOVA SURE</th><th class="r">Difference</th></tr></thead><tbody>'];
        [['Orders ending in a cancellation', legacyMix.cancel, sureMix.cancel],
         ['Orders arriving >15 min after the promise', legacyMix.late15, sureMix.late15],
         ['Orders with an unapproved substitution', legacyMix.sub, sureMix.sub],
         ['Orders needing a refund or support fix', legacyMix.ticket, sureMix.ticket]].forEach(function (r) {
          var a = r[1] * N, b = r[2] * N;
          out.push('<tr><td>' + r[0] + '</td><td class="r num">' + a.toFixed(0) + '</td><td class="r num"><b>' + b.toFixed(0) + '</b></td>' +
            '<td class="r num up-good" style="font-weight:700">' + (b - a).toFixed(0) + ' (' + F.signed(a === 0 ? 0 : (b - a) / a, 0) + ')</td></tr>');
        });
        out.push('<tr><td>Second order within 30 days</td><td class="r num">' + F.pct(bcL.p2, 1) + '</td><td class="r num"><b>' + F.pct(bcS.p2, 1) + '</b></td><td class="r num up-good" style="font-weight:700">' + F.signed(bcS.p2 - bcL.p2, 1) + '</td></tr>');
        out.push('<tr><td>Lifetime orders per acquired customer</td><td class="r num">' + bcL.ordersPerCustomer.toFixed(2) + '</td><td class="r num"><b>' + bcS.ordersPerCustomer.toFixed(2) + '</b></td><td class="r num up-good" style="font-weight:700">' + F.signed(bcS.ordersPerCustomer / bcL.ordersPerCustomer - 1, 1) + '</td></tr>');
        out.push('</tbody></table><div class="grid g3" style="margin-top:16px">');
        out.push(tile('Lifetime revenue per customer', F.inr(bcL.ordersPerCustomer * 486 * 0.1395) + ' → ' + F.inr(bcS.ordersPerCustomer * 486 * 0.1395), '+' + F.inr(bcS.ordersPerCustomer * 486 * 0.1395 - bcL.ordersPerCustomer * 486 * 0.1395) + ' each', 'up-good', 'with no extra acquisition spend'));
        out.push(tile('Support tickets avoided', Math.round((legacyMix.ticket - sureMix.ticket) * N) + ' per 1,000', '≈ ' + F.inr(Math.round((legacyMix.ticket - sureMix.ticket) * N * 75)) + ' saved', 'up-good', 'at ₹75 per ticket'));
        out.push(tile('Value of fixing this store alone', F.lakh(NC.storeStats(store).exposure * 0.55) + '/mo', 'this store\'s exposure × 55% recoverable', 'up-good', F.num(store.monthlyOrders) + ' orders/mo'));
        out.push('</div><p class="mini" style="margin-top:12px">The multipliers that turn a bad experience into a churn risk are explicit in the engine (' +
          Object.keys(NC.OUTCOME_MULT).map(function (k) { return k + ' ×' + NC.OUTCOME_MULT[k]; }).join(' · ') +
          ') and are normalised so that today\'s failure mix reproduces today\'s 31% second-order rate exactly. Nothing here is a magic number.</p>');
        out.push('<div class="btnrow" style="margin-top:14px"><button class="btn" data-act="step" data-step="3">← the promise</button>' +
          '<button class="btn dark" data-act="tab" data-tab="store">Now the store\'s side →</button></div></div>');
        return out.join('');
      })();

      return stepbar + '<div class="grid g23">' + left + right + '</div>' + proof;
    }

    return stepbar + '<div class="card"><p>Unknown step.</p></div>';
  }

  /* ============================== STORE APP ============================== */
  function viewStore() {
    var A = NC.APP;
    var store = NC.storeById(A.storeId) || NC.STORES[0];
    var st = NC.storeStats(store);
    var flagged = NC.SKUS.map(function (k) { return { k: k, a: NC.availability(store, k) }; })
      .filter(function (x) { return x.a.score < 82; })
      .sort(function (a, b) { return a.a.score - b.a.score; }).slice(0, 8);
    var peers = NC.STORES.filter(function (s) { return s.city === store.city; }).sort(function (a, b) { return b.reliability - a.reliability; });
    var rank = peers.findIndex(function (s) { return s.id === store.id; }) + 1;

    return '<div class="sec-title"><h2>NOVA SURE Sync — the partner app</h2>' +
      '<p>If updating the catalogue is hard, the catalogue will be wrong. So the whole job is 15 seconds, twice a day.</p>' +
      '<span class="pill">store view</span></div>' +

      '<div class="card tight" style="margin-bottom:14px"><div class="btnrow">' +
      '<span class="mini" style="margin-right:6px"><b>Switch store:</b></span>' +
      NC.STORES.slice().sort(function (a, b) { return a.reliability - b.reliability; }).map(function (s) {
        return '<button class="btn sm ' + (s.id === store.id ? 'primary' : '') + '" data-act="gotostore" data-store="' + s.id + '">' +
          esc(s.name.split(' ').slice(0, 3).join(' ')) + ' · ' + s.reliability + '</button>';
      }).join('') + '</div></div>' +

      '<div class="card" style="margin-bottom:16px"><div class="grid g4" style="align-items:center">' +
      '<div><div class="mini">Logging in as</div><div style="font-size:15px;font-weight:700">' + esc(store.name) + '</div>' +
      '<div class="mini">' + store.category + ' · ' + esc(store.area) + ', ' + store.city + ' · ★ ' + store.rating + '</div></div>' +
      tile('Reliability score', store.reliability + ' / 100', 'rank ' + rank + ' of ' + peers.length + ' in ' + store.city, store.reliability >= 70 ? 'up-good' : 'up-bad', (store.touched ? 'updated by you' : 'not yet synced today')) +
      tile('Catalogue age', store.syncHours <= 2 ? 'live' : store.syncHours + ' h', store.syncHours <= 2 ? 'certified' : 'too old to promise', store.syncHours <= 6 ? 'up-good' : 'up-bad', store.syncPerDay + ' syncs/day') +
      tile('Revenue at risk this month', F.inr(st.exposure), 'from stock failures', 'up-bad', F.num(st.cancels) + ' cancelled orders')
      + '</div></div>' +

      '<div class="grid g23">' +
      '<div class="card"><h2>Verify your shelf — 8 items need you</h2>' +
      '<p class="sub">Tap one answer per item. That is the entire job. Nothing to type, nothing to upload, no spreadsheet.</p>' +
      (flagged.length ? flagged.map(function (x) {
        var k = x.k, a = x.a;
        return '<div class="planbox"><h4><span>' + esc(k.name) + '</span>' + bandBadge(a) + '</h4>' +
          '<p class="mini">' + esc(a.evidence) + '</p>' +
          '<div class="btnrow" style="margin-top:8px">' +
          '<button class="btn sm ok" data-act="sync" data-store="' + store.id + '" data-sku="' + k.id + '" data-state="in">✔ Plenty in stock</button>' +
          '<button class="btn sm" data-act="sync" data-store="' + store.id + '" data-sku="' + k.id + '" data-state="low">⚠ Only a few left</button>' +
          '<button class="btn sm" data-act="sync" data-store="' + store.id + '" data-sku="' + k.id + '" data-state="out">✖ Out of stock</button>' +
          '</div></div>';
      }).join('') : '<p class="mini">Every item on this shelf is verified and fresh. Nothing to do — the app will tell you before the evening peak.</p>') +
      '</div>' +

      '<div>' +
      '<div class="card"><h2>What the store gets</h2>' +
      '<div class="kv"><span>Orders you can actually fulfil</span><b class="up-good">+ more, not fewer</b></div>' +
      '<div class="kv"><span>Angry customer calls</span><b class="up-good">' + F.num(Math.round(st.tickets * 0.45)) + ' fewer/mo</b></div>' +
      '<div class="kv"><span>Ranking in ' + store.city + '</span><b>' + rank + ' of ' + peers.length + ' → up as you sync</b></div>' +
      '<div class="kv"><span>Your commission</span><b>unchanged — NOVA CART never touches your price</b></div>' +
      '<div class="rule"></div>' +
      '<h3>Why partners leave (case §6)</h3>' +
      barRows(NC.CASE.partnerSurvey.slice(1).map(function (p, i) {
        var cols = ['#d0342c', '#e2932b', '#6b3fd4', '#e2683c', '#d0342c'];
        return { label: p.text, value: p.pct, display: p.pct + '%', colour: cols[i % 5] };
      })) +
      '<div class="quote">"NOVA CART gives us orders, but sometimes maintaining the online catalogue takes more effort than the additional business is worth." — case §6</div>' +
      '<p class="mini">The old answer was to ask stores to try harder. The new answer is to make the job 15 seconds and show them, in rupees, what it is worth.</p>' +
      '</div>' +
      '<div class="card" style="margin-top:16px"><h2>Peak-hour capacity</h2>' +
      '<p class="sub">Case §6: 23% of stores sometimes reject orders in busy periods. The app now asks before the rush, not during it.</p>' +
      '<div class="kv"><span>Tonight\'s forecast (this store)</span><b>' + Math.round(store.monthlyOrders / 30) + ' orders</b></div>' +
      '<div class="kv"><span>Your confirmed capacity</span><b>' + Math.round(store.monthlyOrders / 30 * store.acceptRate) + '</b></div>' +
      '<div class="kv"><span>Honest acceptance rate</span><b>' + F.pct(store.acceptRate) + '</b></div>' +
      '<div class="mini" style="margin-top:8px">NOVA SURE will only send what you can accept. Rejections are logged as a capacity signal, not as a failure — which is how they stop being a failure.</div>' +
      '</div></div></div>';
  }

  /* ============================== OPS CONSOLE ============================ */
  function viewOps() {
    var A = NC.APP;
    var L = NC.leakMap(), R = NC.worldRates();
    var queue = NC.interventionQueue();
    var applied = NC.STATE.interventions || [];
    var cov = NC.coverageFromWorld();
    var appliedKeys = {};
    applied.forEach(function (i) { appliedKeys[i.storeId + '|' + i.actionId] = 1; });
    var top = queue.filter(function (q) { return !appliedKeys[q.storeId + '|' + q.id]; }).slice(0, 12);

    return '<div class="sec-title"><h2>Trust Console</h2>' +
      '<p>One screen for the failure the customer never sees: which stores are promising things they cannot deliver, and what fixing them is worth.</p>' +
      '<span class="pill grape">ops view</span></div>' +

      '<div class="grid g5" style="margin-bottom:16px">' +
      tile('Cancellation rate', F.pct(R.cancel, 1), (R.cancel < 0.11 ? '▼ ' + F.pct(0.11 - R.cancel, 1) : '▲ ' + F.pct(R.cancel - 0.11, 1)) + ' vs baseline', R.cancel <= 0.11 ? 'up-good' : 'up-bad', 'case §5 baseline 11%') +
      tile('Late >15 min', F.pct(R.late, 1), (R.late < 0.13 ? '▼ ' + F.pct(0.13 - R.late, 1) : '▲ ' + F.pct(R.late - 0.13, 1)), R.late <= 0.13 ? 'up-good' : 'up-bad', 'baseline 13%') +
      tile('Tickets / month', F.num(Math.round(38500 * R.ticket)), Math.round(38500 * R.ticket) < 5900 ? '▼ ' + F.num(5900 - Math.round(38500 * R.ticket)) : '▲ ' + F.num(Math.round(38500 * R.ticket) - 5900), Math.round(38500 * R.ticket) <= 5900 ? 'up-good' : 'up-bad', 'baseline 5,900') +
      tile('Direct leak / month', F.lakh(L.reliabilityLeak), applied.length ? 'recovered ' + F.inr(NC.STATE.recovered) + ' so far' : 'nothing recovered yet', applied.length ? 'up-good' : 'up-bad', F.cr(L.annualisedDirect) + ' annualised') +
      tile('Order volume covered by the fix', F.pct(cov, 0), cov >= 0.55 ? 'target 55% reached' : 'target 55% by month 6', cov >= 0.55 ? 'up-good' : 'flat', applied.length + ' interventions applied')
      + '</div>' +

      '<div class="grid g23">' +
      '<div class="card"><h2>The leak, line by line</h2><p class="sub">Ranked by owner. Every figure recomputes the moment you change a store.</p>' +
      '<div class="leakbar">' + L.lines.map(function (l, i) {
        var cols = ['#d0342c', '#e2683c', '#e2932b', '#6b3fd4', '#1b64f2'];
        return '<div style="width:' + (l.value / L.reliabilityLeak * 100).toFixed(1) + '%;background:' + cols[i % 5] + '">' + (l.value / L.reliabilityLeak > 0.13 ? F.lakh(l.value) : '') + '</div>';
      }).join('') + '</div>' +
      '<table style="margin-top:12px"><thead><tr><th>Line</th><th>Owner</th><th class="r">₹ / month</th><th>Lever</th></tr></thead><tbody>' +
      L.lines.map(function (l) {
        return '<tr><td><b>' + esc(l.label) + '</b><br><span class="mini">' + esc(l.detail) + '</span></td><td>' + esc(l.owner) + '</td>' +
          '<td class="r num">' + F.lakh(l.value) + '</td><td class="mini">' + esc(l.lever) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +

      '<div class="card"><h2>Store league table</h2><p class="sub">Sorted by reliability. This is the ranked list ops works down.</p>' +
      '<div class="scroll"><table><thead><tr><th>Store</th><th class="r">Rel.</th><th class="r">Cat. age</th><th class="r">Cancel</th><th class="r">Exposure</th><th></th></tr></thead><tbody>' +
      NC.rankStores('reliability').map(function (s) {
        var st = NC.storeStats(s);
        var col = s.reliability >= 80 ? 'var(--ok)' : s.reliability >= 60 ? '#7cb518' : s.reliability >= 45 ? 'var(--warn)' : 'var(--dang)';
        return '<tr><td><b>' + esc(s.name) + '</b><br><span class="mini">' + s.city + ' · ' + s.category + (s.touched ? ' · <b style="color:var(--ok)">fixed</b>' : '') + '</span></td>' +
          '<td class="r num" style="color:' + col + ';font-weight:700">' + s.reliability + '</td>' +
          '<td class="r num">' + (s.syncHours <= 2 ? 'live' : s.syncHours + ' h') + '</td>' +
          '<td class="r num">' + F.pct(s.cancelRate, 1) + '</td>' +
          '<td class="r num">' + F.inr(st.exposure) + '</td>' +
          '<td class="r"><button class="btn sm" data-act="gotostore" data-store="' + s.id + '">Open</button></td></tr>';
      }).join('') + '</tbody></table></div></div></div>' +

      '<div class="sec-title"><h2>Intervention queue</h2><p>Generated from the live store data — not a static list. Value = cancelled revenue + ticket cost + substitution cost avoided; lifetime value is shown separately so it is never double-counted.</p></div>' +

      '<div class="card"><div class="btnrow" style="margin-bottom:12px">' +
      '<button class="btn primary" data-act="autoheal" data-n="20">⚡ Auto-heal top 20 interventions</button>' +
      '<button class="btn" data-act="autoheal" data-n="6">Auto-heal top 6</button>' +
      '<button class="btn" data-act="reset" >Reset ops state</button>' +
      '<span class="mini">Coverage now ' + F.pct(cov, 0) + ' of order volume · ' + applied.length + ' actions applied · ' + F.inr(NC.STATE.recovered) + ' of monthly value recovered</span>' +
      '</div>' +
      '<table><thead><tr><th style="width:34px">#</th><th>Action</th><th>Store</th><th class="r">Rel.</th><th class="r">Cat. age</th><th class="r">₹/month</th><th class="r">Effort</th><th class="r"></th></tr></thead><tbody>' +
      top.map(function (q) {
        return '<tr class="qrow"><td class="num">' + q.rank + '</td>' +
          '<td>' + esc(q.label) + '<br><span class="mini">cancels −' + Math.round(q.cutCancel * 100) + '% · subs −' + Math.round(q.cutSub * 100) + '% · tickets −' + Math.round(q.cutTicket * 100) + '% · lifetime value ' + F.inr(q.vRepeat) + '/mo</span></td>' +
          '<td>' + esc(q.storeName) + '<br><span class="mini">' + q.city + '</span></td>' +
          '<td class="r num">' + q.reliability + '</td>' +
          '<td class="r num">' + (q.syncHours <= 2 ? 'live' : q.syncHours + 'h') + '</td>' +
          '<td class="r num"><b>' + F.inr(q.gain) + '</b></td>' +
          '<td class="r num">' + '●'.repeat(q.effort) + '</td>' +
          '<td class="r"><button class="btn sm" data-act="apply" data-store="' + q.storeId + '" data-action="' + q.id + '">Apply</button></td></tr>';
      }).join('') + '</tbody></table>' +
      '<p class="mini" style="margin-top:10px">Total monthly value in the queue: <b>' + F.lakh(queue.totalMonthly) + '</b> · lifetime revenue protected: <b>' + F.lakh(queue.totalLifetime) + '</b>. Actions are priced incrementally per store, so two fixes on one store never double-count the same cancelled order.</p>' +
      '</div>' +

      '<div class="grid g3" style="margin-top:16px">' +
      '<div class="card"><h2>What the fix does to the business</h2>' +
      '<p class="sub">The scenario model reads the console\'s live coverage figure.</p>' +
      (function () {
        var sc = NC.scenarios(NC.DEFAULTS, Math.min(1, 0.55 + 0.45 * Math.min(1, cov)));
        A.opsScenarios = sc;
        return '<div class="kv"><span>Coverage used in the model</span><b>' + F.pct(sc.B.coverage, 0) + '</b></div>' +
          '<div class="kv"><span>Plan B orders, month 6</span><b>' + F.num(sc.B.m6.orders) + '</b></div>' +
          '<div class="kv"><span>Plan B orders, month 12</span><b>' + F.num(sc.B.m12.orders) + '</b></div>' +
          '<div class="kv"><span>Δ contribution vs today, month 12</span><b class="up-good">' + F.lakh(sc.B.m12.contribution) + '/mo</b></div>' +
          '<div class="kv"><span>12-month cumulative</span><b>' + F.lakh(sc.B.cumulative12) + '</b></div>' +
          '<div class="kv"><span>Cash payback month</span><b>' + (sc.B.paybackMonth ? 'M' + sc.B.paybackMonth : 'beyond M12') + '</b></div>' +
          '<div class="kv"><span>Repeat rate, month 12</span><b>' + F.pct(sc.B.m12.repeatRate, 1) + ' (today 27.0%)</b></div>';
      })() +
      '</div>' +
      '<div class="card"><h2>Activity log</h2>' +
      (applied.length ? '<div class="log">' + applied.slice().reverse().map(function (i) {
        var s = NC.storeById(i.storeId);
        return '<div class="e"><span class="pill mut">#' + i.n + '</span><span><b>' + esc(s ? s.name : i.storeId) + '</b>' + esc(i.label) + '</span><span class="g num">+' + F.inr(i.gain) + '/mo</span></div>';
      }).join('') + '</div>' : '<div class="log"><div class="empty">No actions yet. Apply one intervention — every screen in this app updates from the same live state.</div></div>') +
      '<div class="rule"></div>' +
      '<div class="kv"><span>Total value recovered</span><b class="up-good">' + F.inr(NC.STATE.recovered) + ' / month</b></div>' +
      '<div class="kv"><span>Actions remaining</span><b>' + (queue.length - applied.length) + '</b></div>' +
      '</div>' +
      '<div class="card"><h2>Where the failures concentrate</h2><p class="sub">Cancellation and substitution rate by store, live.</p>' +
      barRows(NC.STORES.slice().sort(function (a, b) { return b.cancelRate - a.cancelRate; }).slice(0, 7).map(function (s) {
        return { label: s.name + ' · ' + (s.syncHours <= 2 ? 'live' : s.syncHours + 'h'), value: s.cancelRate, display: F.pct(s.cancelRate, 1) + ' cancel', colour: s.cancelRate > 0.15 ? '#d0342c' : s.cancelRate > 0.10 ? '#e2932b' : '#0f9d58' };
      })) +
      '<p class="mini" style="margin-top:10px">The pattern in the data: the stores with the oldest catalogue have the highest cancellation rates. That is the whole thesis, visible in one chart.</p>' +
      '</div></div>';
  }

  /* ============================= DECISION ROOM =========================== */
  function viewDecision() {
    var A = NC.APP;
    var P = A.params || NC.DEFAULTS;
    var cov = Math.min(1, 0.55 + 0.45 * Math.min(1, NC.coverageFromWorld()));
    var sc = NC.scenarios(P, cov);
    var sens = A.sensitivity || (A.sensitivity = NC.sensitivity(P, cov));
    var C = NC.CASE;

    function fld(key, label, min, max, step, fmt, hint) {
      var v = P[key];
      return '<label class="fld"><span class="n"><span>' + label + '</span><b>' + fmt(v) + '</b></span>' +
        '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '" data-act="param" data-param="' + key + '"/>' +
        (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
    }

    function planCard(s, tone) {
      return '<div class="card" style="border-top:4px solid ' + tone + '">' +
        '<h2>' + esc(s.plan.name) + '</h2><p class="sub">' + esc(s.plan.tagline) + '</p>' +
        '<table><tbody>' +
        '<tr><td>Orders, month 6</td><td class="r num"><b>' + F.num(s.m6.orders) + '</b><br><span class="mini">' + F.signed(s.m6.orders / 38500 - 1, 1) + ' vs today</span></td></tr>' +
        '<tr><td>Orders, month 12</td><td class="r num"><b>' + F.num(s.m12.orders) + '</b><br><span class="mini">' + F.signed(s.m12.orders / 38500 - 1, 1) + '</span></td></tr>' +
        '<tr><td>Revenue, month 12</td><td class="r num">' + F.lakh(s.m12.revenue) + '<br><span class="mini">' + F.signed(s.m12.revenue / C.kpi.revenue.now - 1, 1) + '</span></td></tr>' +
        '<tr><td>Marketing, month 12</td><td class="r num">' + F.lakh(s.m12.promo) + '</td></tr>' +
        '<tr><td>Tickets, month 12</td><td class="r num">' + F.num(s.m12.tickets) + '</td></tr>' +
        '<tr><td>Repeat rate, month 12</td><td class="r num">' + F.pct(s.m12.repeatRate, 1) + '<br><span class="mini">today 27.0%</span></td></tr>' +
        '<tr><td><b>Δ monthly contribution, M12</b></td><td class="r num"><b class="' + (s.m12.contribution >= 0 ? 'up-good' : 'up-bad') + '">' + F.signed(s.m12.contribution / s.m12.revenue || 0, 0) + '</b><br><b>' + F.lakh(s.m12.contribution) + '</b></td></tr>' +
        '<tr><td>12-month cumulative Δ</td><td class="r num"><b class="' + (s.cumulative12 >= 0 ? 'up-good' : 'up-bad') + '">' + F.lakh(s.cumulative12) + '</b></td></tr>' +
        '<tr><td>Programme spend</td><td class="r num">' + F.lakh(s.programSpent) + '</td></tr>' +
        '<tr><td>Cash payback</td><td class="r num">' + (s.paybackMonth ? '<b class="up-good">month ' + s.paybackMonth + '</b>' : '<span class="mini">n/a</span>') + '</td></tr>' +
        '</tbody></table></div>';
    }

    var months = sc.B.rows.map(function (r) { return 'M' + r.month; });
    var orderChart = lineChart([
      { name: 'Plan A — buy growth', colour: '#e2932b', values: sc.A.rows.map(function (r) { return r.orders; }), dashed: true },
      { name: 'Plan B — NOVA SURE', colour: '#1b64f2', values: sc.B.rows.map(function (r) { return r.orders; }), width: 3 },
      { name: 'Plan C — do nothing', colour: '#9aa8ba', values: sc.C.rows.map(function (r) { return r.orders; }) }
    ], { xlabels: months, fmt: function (v) { return Math.round(v / 1000) + 'k'; } });

    var contribChart = lineChart([
      { name: 'Plan A — buy growth', colour: '#e2932b', values: sc.A.rows.map(function (r) { return r.contribution; }), dashed: true },
      { name: 'Plan B — NOVA SURE', colour: '#0f9d58', values: sc.B.rows.map(function (r) { return r.contribution; }), width: 3, fill: true },
      { name: 'Plan C — do nothing', colour: '#9aa8ba', values: sc.C.rows.map(function (r) { return r.contribution; }) }
    ], { xlabels: months, zeroBase: true, fmt: function (v) { return F.lakh(v, 0); } });

    var heat = '<table class="heat"><thead><tr><th>Rollout coverage ⬇ / marketing spend →</th>' +
      sens.spends.map(function (s) { return '<th class="h r">' + (s.toFixed(1)) + '×</th>'; }).join('') + '</tr></thead><tbody>' +
      sens.grid.map(function (row, i) {
        return '<tr><td class="h">' + (sens.lifts[i] * 100) + '%</td>' + row.map(function (c) {
          var v = c.contribution6;
          var col = v > 1500000 ? '#0f9d58' : v > 500000 ? '#5aa832' : v > 0 ? '#e2932b' : '#d0342c';
          var bg = v > 1500000 ? '#e6f7ee' : v > 500000 ? '#f0f7e3' : v > 0 ? '#fdf6e8' : '#fdeceb';
          return '<td style="background:' + bg + ';color:' + col + '">' + F.lakh(v, 0) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';

    var gap = sc.B.cumulative12 - sc.A.cumulative12;
    return '<div class="sec-title"><h2>Decision Room</h2>' +
      '<p>Take the argument the management team is having and put numbers on it. Every slider is an assumption you can defend or attack.</p>' +
      '<span class="pill">12-month model</span></div>' +

      '<div class="card" style="border-left:4px solid var(--acc);margin-bottom:16px">' +
      '<h2 style="font-size:18px">The decision, in one line</h2>' +
      '<p class="sub" style="margin:6px 0 0">Continuing the last six months (Plan A) ends the year <b class="up-bad">' + F.lakh(sc.A.cumulative12) + '</b> against today. ' +
      'Doing nothing (Plan C) ends <b class="up-bad">' + F.lakh(sc.C.cumulative12) + '</b>. NOVA SURE (Plan B) ends <b class="up-good">' + F.lakh(sc.B.cumulative12) + '</b>. ' +
      'The gap between the plan we are already running and the plan we could run is <b>' + F.lakh(gap) + '</b> — that is the number to argue with. ' +
      'Payback (month ' + (sc.B.paybackMonth || '—') + ') is the second-order fact underneath it.</p>' +
      '</div>' +

      '<div class="grid g4" style="margin-bottom:16px">' +
      tile('Plan B beats Plan A by', F.lakh(sc.B.cumulative12 - sc.A.cumulative12), 'over 12 months', 'up-good', 'after paying the full ₹25L') +
      tile('Plan B run-rate, M12', F.lakh(sc.B.m12.contribution) + '/mo', 'vs Plan A ' + F.lakh(sc.A.m12.contribution) + '/mo', 'up-good', 'both measured against today') +
      tile('Plan B payback', sc.B.paybackMonth ? 'Month ' + sc.B.paybackMonth : '—', 'cumulative cash turns positive', 'up-good', 'Plan A: never') +
      tile('Cost of doing nothing', F.lakh(sc.C.cumulative12), 'over 12 months', 'up-bad', 'orders ' + F.num(sc.C.m12.orders) + ' by M12') +
      '</div>' +

      '<div class="grid g23">' +
      '<div class="card"><h2>Monthly order volume — the three plans</h2><p class="sub">Plan A and Plan B end up in the same place on volume. Only one of them pays for it twice.</p>' + orderChart + '</div>' +
      '<div class="card"><h2>Δ Monthly contribution vs today</h2><p class="sub">Failure costs, promotion spend and programme spend all included. Positive = better than standing still.</p>' + contribChart + '</div>' +
      '</div>' +

      '<div class="grid g3" style="margin-top:16px">' + planCard(sc.C, '#9aa8ba') + planCard(sc.A, '#e2932b') + planCard(sc.B, '#1b64f2') + '</div>' +

      '<div class="grid g23" style="margin-top:16px">' +
      '<div class="card"><h2>Sensitivity — 6-month cumulative Δ contribution</h2>' +
      '<p class="sub">Rows: share of order volume on the fixed stack. Columns: marketing spend vs today. Green = better off than today. The diagonal question management is really asking: <i>can we buy our way out?</i> No — every column gets worse as spend rises.</p>' +
      heat +
      '<p class="mini" style="margin-top:10px">Read it two ways. (1) At any spend level, coverage moves contribution up. (2) At any coverage level, extra spend moves contribution down — because the marginal rupee of marketing returns ₹0.57. That is the entire argument between the marketing head and the finance head, settled with their own numbers.</p>' +
      '</div>' +
      '<div class="card"><h2>Assumptions you can change</h2><p class="sub">Nothing is hidden. Move any of these and every number in the app recomputes.</p>' +
      fld('reliabilityShare', 'Share of the repeat-rate collapse attributed to reliability', 0.2, 1, 0.05, function (v) { return F.pct(v, 0); }, 'The rest is attributed to the acquisition mix (discount-led cohorts retain worse). We split it 60/40 by default.') +
      fld('retentionResponse', 'Monthly churn reduction at full rollout', 0, 0.5, 0.05, function (v) { return F.pct(v, 0); }, 'How much of the returning base\'s churn the reliability fix removes.') +
      fld('firstOrderConv', 'First-order conversion of new users', 0.4, 0.7, 0.01, function (v) { return F.pct(v, 0); }, 'Case §4: 54%.') +
      fld('secondOrder30d', 'Second order within 30 days', 0.2, 0.5, 0.01, function (v) { return F.pct(v, 0); }, 'Case §4: 31%. The single most leveraged number in the funnel.') +
      fld('loyaltyMonths', 'Months an established (3+) customer keeps ordering', 6, 30, 1, function (v) { return v + ' months'; }, 'Case §4 gives 72% monthly repeat for this tier; this parameter is calibrated so the model reproduces NOVA CART\'s observed order volume.') +
      fld('sigmaBase', 'Delivery-time variability (minutes, 1σ)', 3, 14, 0.5, function (v) { return v + ' min'; }, 'Drives the late-rate tail. Today\'s 13% late rate implies about 8 minutes.') +
      fld('promiseOffset', 'Promised time vs the honest estimate', -6, 6, 1, function (v) { return (v > 0 ? '+' : '') + v + ' min'; }, '−6 min is today\'s optimistic promise. NOVA SURE uses 0 or slightly positive.') +
      '<div class="rule"></div>' +
      '<div class="btnrow"><button class="btn" data-act="resetparams">Reset to case defaults</button></div>' +
      assumptionsBox('decision') +
      '<p class="mini" style="margin-top:10px">Calibration note: the disclosed funnel (54% → 31% → 72%) does not, read literally, reproduce the disclosed 38,500 orders from 3,420 new buyers a month. Rather than hide that, we calibrate two aggregate parameters — monthly retention of the active base and the lifetime of an established customer — so the model reproduces the observed P&amp;L, and keep the funnel rates for their marginal effect. Both are sliders above.</p>' +
      '</div></div>' +

      '<div class="card" style="margin-top:16px"><h2>What has to be true for Plan B to work</h2>' +
      '<div class="grid g3">' +
      '<div><h3>1. Coverage</h3><p class="mini">55% of order volume on the fixed stack by month 6, 100% by month 12. This is an operations commitment, not a technology one — it is 2 taps a day in 620 stores.</p></div>' +
      '<div><h3>2. Attribution</h3><p class="mini">At least 40% of the repeat-rate collapse is reliability-driven. Below that, the same ₹25L spent on retention marketing alone would be competitive — the sensitivity grid shows the break-even row.</p></div>' +
      '<div><h3>3. Promise honesty</h3><p class="mini">Management accepts a longer, keepable window instead of a shorter, missed one. If the ETA promise stays optimistic, the late-rate gains halve.</p></div>' +
      '</div></div>';
  }

  /* =============================== COPILOT =============================== */
  function viewCopilot() {
    var A = NC.APP;
    var ans = A.asked;
    return '<div class="sec-title"><h2>NOVA SURE Copilot</h2>' +
      '<p>A reasoning partner, not an oracle: every answer is computed from the case data and the live model, and shows its arithmetic.</p>' +
      '<span class="pill grape">prompt · validate</span></div>' +

      '<div class="grid g32">' +
      '<div class="card"><h2>Ask the evidence</h2><p class="sub">These are the questions the management team is actually arguing about.</p>' +
      '<div class="chips">' + NC.copilotPrompts.map(function (q, i) {
        return '<button class="chip" data-act="ask-chip" data-i="' + i + '">' + esc(q) + '</button>';
      }).join('') + '</div>' +
      '<div class="rule"></div>' +
      '<form data-act="ask-form"><div class="btnrow">' +
      '<input type="text" id="qbox" placeholder="Or type your own question…" value="' + esc(A.question) + '" style="flex:1;min-width:180px" data-act="qbox"/>' +
      '<button class="btn primary" data-act="ask">Ask</button></div></form>' +
      '<div class="rule"></div>' +
      '<h3>How this copilot works</h3>' +
      '<p class="mini">It is a deterministic reasoning layer, not a chat wrapper: each question triggers a computation over the case pack and the live model (leak map, funnel simulation, scenario engine) and returns the headline, the evidence, the method and a confidence level. That is deliberate — in a business case, a wrong number costs more than a slow answer, so nothing is generated that cannot be recomputed.</p>' +
      '<div class="rule"></div>' +
      '<h3>The prompt journey</h3>' +
      '<p class="mini">The four prompts that changed the product direction, kept in the written submission:</p>' +
      '<div class="promptcard"><div class="q">1. “Compute the incremental ROAS and the promo-per-order for both periods.”</div>' +
      '<div class="a">→ ₹1 of extra marketing returned ₹0.57 of revenue, and promotions now consume 65% of net revenue per order. The marketing plan died here.</div></div>' +
      '<div class="promptcard"><div class="q">2. “If 61% of churners rated us 4★+, what kind of failure produces that?”</div>' +
      '<div class="a">→ Not a product failure — a broken-promise failure. It moved priority from features to fulfilment.</div></div>' +
      '<div class="promptcard"><div class="q">3. “Which single metric explains the most cancellations, tickets and delays?”</div>' +
      '<div class="a">→ Catalogue age. It is upstream of 53% of cancellations and it is the one thing a store can fix in 15 seconds.</div></div>' +
      '<div class="promptcard"><div class="q">4. “Challenge the conclusion: why isn\'t this just brand awareness or pricing?”</div>' +
      '<div class="a">→ Because we are already the cheapest-promise option, already discounting heavily, and still losing 4★ customers. Price was demoted from cause to symptom.</div></div>' +
      '</div>' +

      '<div class="card"><h2>Conversation</h2>' +
      '<div class="chat" id="chat">' +
      (ans ? '<div class="msg user">' + esc(ans.q) + '</div>' +
        '<div class="msg bot"><h4>' + esc(ans.headline) + '</h4>' +
        (ans.matched === false ? '<ul>' + ans.evidence.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '<ul>' + ans.evidence.map(function (e) { return '<li>' + e + '</li>'; }).join('') + '</ul>') +
        '<span class="tag">Method</span><div>' + esc(ans.method) + '</div>' +
        '<div class="rec">→ ' + esc(ans.recommendation) + '</div>' +
        '<span class="tag">Confidence</span><div>' + esc(ans.confidence) + '</div>' +
        '</div>'
        : '<div class="msg bot"><h4>Ask something.</h4><p class="sub" style="margin:0">Pick a question on the left, or type your own. Answers are computed live — if you fix a store in the Ops Console, the answers here change.</p></div>') +
      '</div></div></div>';
  }

  /* ============================== RENDER ================================= */
  function trustStrip() {
    var R = NC.worldRates(), L = NC.leakMap();
    return '<div class="topmeta">' +
      '<div>Cancellations<b>' + F.pct(R.cancel, 1) + '</b></div>' +
      '<div>Late &gt;15 min<b>' + F.pct(R.late, 1) + '</b></div>' +
      '<div>Tickets / mo<b>' + F.num(Math.round(38500 * R.ticket)) + '</b></div>' +
      '<div>Leak / mo<b>' + F.lakh(L.reliabilityLeak) + '</b></div>' +
      '<div>Fixed volume<b>' + F.pct(NC.coverageFromWorld(), 0) + '</b></div>' +
      '</div>';
  }

  NC.trustStrip = trustStrip;

  NC.views = { diagnosis: viewDiagnosis, customer: viewCustomer, store: viewStore, ops: viewOps, decision: viewDecision, copilot: viewCopilot };

  NC.renderApp = function () {
    var A = NC.APP;
    var tabs = [['diagnosis', 'Diagnosis'], ['customer', 'Customer app'], ['store', 'Store app'], ['ops', 'Ops Trust Console'], ['decision', 'Decision Room'], ['copilot', 'Copilot']];
    return '<div class="wrap">' +
      '<div class="sec-title" style="margin-top:0"></div>' +
      NC.views[A.tab]() +
      (A.toast ? '<div class="toast">' + esc(A.toast) + '</div>' : '') +
      '</div>';
  };

  /* ============================ DISPATCHER =============================== */
  NC.dispatch = function (act, el, ev) {
    var A = NC.APP, d = el.dataset || {};
    switch (act) {
      case 'tab': A.tab = d.tab; break;
      case 'city': A.city = d.city; A.storeId = (NC.STORES.filter(function (s) { return s.city === d.city; })[0] || {}).id; A.step = 1; A.seedDone = false; break;
      case 'store': A.storeId = d.store; A.seedDone = false; A.step = 2; break;
      case 'gotostore': A.storeId = d.store; A.city = NC.storeById(d.store).city; A.tab = 'store'; break;
